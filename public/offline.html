<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión</title>
    <!--
      Esta página la sirve el service worker cuando no hay red. No puede
      cargar next-intl ni globals.css: los hex de abajo son --canvas y --text
      de app/globals.css. El idioma se elige con navigator.language.
    -->
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f5f7;
        --ink: #1d1d1f;
        --ink-2: #6e6e73;
        --fill: #c6500b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #0b0b0d;
          --ink: #f5f5f7;
          --ink-2: #a1a1a8;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 26px;
        line-height: 1.2;
        margin: 0 0 8px;
      }
      p {
        font-size: 16px;
        line-height: 1.45;
        color: var(--ink-2);
        margin: 0 0 20px;
      }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: var(--fill);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Sin conexión</h1>
      <p id="body">
        Ember Cash necesita internet. Lo que ves aquí no sale de una copia guardada: los datos de
        tu dinero no se guardan en el caché.
      </p>
      <button id="retry" type="button">Reintentar</button>
    </main>
    <script>
      if ((navigator.language || "").toLowerCase().startsWith("en")) {
        document.documentElement.lang = "en";
        document.title = "You are offline";
        document.getElementById("title").textContent = "You are offline";
        document.getElementById("body").textContent =
          "Ember Cash needs the internet. Nothing here comes from a saved copy: your money is never stored in the cache.";
        document.getElementById("retry").textContent = "Retry";
      }
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
    </script>
  </body>
</html>
